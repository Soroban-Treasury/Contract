name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The version in rust-toolchain.toml, so the wasm hash matches a local build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # soroban-sdk only builds a contract through stellar-cli.
      - uses: stellar/stellar-cli@v30.0.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build the contract
        run: sh scripts/build.sh
